<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Blur Time Settings</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
    }
    input {
      margin: 5px 0;
    }
    button {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>Set Blur Time</h2>
  <label for="start-time">Start Time (mm:ss):</label>
  <input type="text" id="start-time" placeholder="01:30" /><br />
  
  <label for="end-time">End Time (mm:ss):</label>
  <input type="text" id="end-time" placeholder="01:45" /><br />
  
  <button id="save-button">Save</button>
  
  <script src="popup.js"></script>
</body>
</html>
